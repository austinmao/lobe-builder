id: TASK-007
title: "Create src/middleware.ts with TENANT_DOMAINS config"
objective: |
  Create the Next.js middleware file that handles custom domain routing. This is
  the core implementation that enables tenant-specific domains to map to the
  unified Payload CMS backend.
scope:
  - Create src/middleware.ts file
  - Define TENANT_DOMAINS configuration object
  - Add ceremonia domain: live.ceremoniacircle.org
  - Implement basic request interception
  - Configure matcher to exclude API routes, static files
constraints:
  - Must not break existing LobeChat routes
  - Middleware must be lightweight (< 10ms overhead)
  - Time: 45 minutes max
acceptance_criteria:
  - "BLOCKING: src/middleware.ts file exists"
  - "BLOCKING: TENANT_DOMAINS contains live.ceremoniacircle.org mapping"
  - "BLOCKING: Matcher excludes api, _next/static, _next/image, favicon.ico"
  - "Middleware compiles without errors"
deliverables:
  - src/middleware.ts file
  - TENANT_DOMAINS configuration
  - Middleware config with matcher
risks:
  - May conflict with existing middleware (none expected)
  - Matcher may be too broad or too narrow
out_of_scope:
  - URL rewriting logic (TASK-008)
  - Path blocking logic (TASK-009)
  - Performance optimization (TASK-012)
estimated_minutes: 45
dependencies: ["TASK-006"]
phase: "phase2-middleware"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "80% - middleware creation and configuration"
  required_tests:
    - "Middleware file loads without errors"
    - "TENANT_DOMAINS config is correct"
    - "Matcher excludes expected paths"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase2-middleware.spec.ts --grep 'rewrite custom domain'"
code_quality:
  max_complexity: 10
  max_function_length: 50
  max_nesting: 3
  no_magic_numbers: true
