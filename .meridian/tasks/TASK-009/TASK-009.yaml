id: TASK-009
title: "Implement path blocking for non-allowed routes"
objective: |
  Implement security logic that blocks access to non-allowed paths on custom
  domains. Only paths in allowedPaths config should be accessible; all others
  should return 404.
scope:
  - Block all paths not in allowedPaths array
  - Return 404 for blocked paths (not redirect)
  - Specifically block /chat, /api, /admin on custom domains
  - Log blocked requests for security monitoring
constraints:
  - Use NextResponse.rewrite() to /404 page
  - Must be explicit blocklist (deny by default)
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: /chat on custom domain returns 404"
  - "BLOCKING: /api/* on custom domain returns 404"
  - "BLOCKING: /admin on custom domain returns 404"
  - "Blocked requests are logged"
deliverables:
  - Path blocking logic in middleware
  - Security logging
  - Deny-by-default implementation
risks:
  - May accidentally block legitimate paths
  - 404 page may not exist
out_of_scope:
  - Custom error pages
  - Rate limiting
  - IP blocking
estimated_minutes: 30
dependencies: ["TASK-008"]
phase: "phase2-middleware"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - security path validation"
  required_tests:
    - "/chat blocked on custom domain"
    - "/api/* blocked on custom domain"
    - "/admin blocked on custom domain"
    - "Arbitrary paths blocked"
    - "/lp/* allowed on custom domain"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase2-middleware.spec.ts --grep 'block non-allowed'"
code_quality:
  max_complexity: 10
  max_function_length: 50
  max_nesting: 3
  no_magic_numbers: true
