id: TASK-004
title: "Verify preview route renders draft pages"
objective: |
  Verify that the existing preview route (/preview/[tenantId]/[slug]) correctly
  renders draft pages from Payload CMS. This validates the PageRenderer integration
  with Payload data.
scope:
  - Navigate to /preview/ceremonia/test-page
  - Verify page renders with correct content
  - Verify Hero section displays
  - Verify no 404 error for draft page
  - Check for console errors
constraints:
  - Do NOT modify existing route code
  - Test with the draft test page from TASK-003
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: /preview/ceremonia/test-page returns HTTP 200"
  - "BLOCKING: Hero section title renders correctly"
  - "BLOCKING: Page uses Untitled UI design system components"
  - "No JavaScript console errors"
deliverables:
  - Screenshot of rendered preview page
  - Verification that PageRenderer works with Payload data
  - List of any rendering issues found
risks:
  - PageRenderer may not handle Payload section format
  - Design system components may not match expected structure
out_of_scope:
  - Modifying PageRenderer component
  - Testing published route (separate task)
  - Mobile responsiveness testing (Phase 3)
estimated_minutes: 30
dependencies: ["TASK-003"]
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - route and render validation"
  required_tests:
    - "Happy path: Draft page renders at preview route"
    - "Content validation: Hero title matches Payload data"
    - "Error path: Non-existent page returns 404"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'render draft page'"
