id: TASK-017
title: "Create PageRenderer component with design system support"
objective: |
  Build the main PageRenderer component that maps Payload page data to
  section components. Support multiple design systems (untitledui, shadcn)
  via the designSystem field, with Untitled UI as the default.
scope:
  - "Create src/components/PageRenderer/index.tsx"
  - "Map blockType to corresponding section component"
  - "Support designSystem switching (untitledui implemented, shadcn placeholder)"
  - "Handle unknown block types gracefully (console warning, skip render)"
  - "Create DESIGN_SYSTEM_COMPONENTS mapping object"
constraints:
  - "Must default to 'untitledui' if designSystem field is missing"
  - "Must not crash on unknown block types"
  - "Shadcn components can be stubs for now (implemented in future phase)"
  - "Time limit: 30-40 minutes"
acceptance_criteria:
  - "BLOCKING: PageRenderer renders Payload page with hero, text, cta, features sections"
  - "BLOCKING: Unknown blockType logs warning and skips render (no crash)"
  - "BLOCKING: designSystem='untitledui' uses Untitled UI components"
  - "designSystem='shadcn' renders placeholder (not crash)"
  - "TypeScript types match Payload page schema"
deliverables:
  - "src/components/PageRenderer/index.tsx"
  - "src/components/PageRenderer/types.ts"
  - "Updated src/components/PageRenderer/sections/index.ts with all exports"
testing_requirements:
  coverage: "75%"
  required_tests:
    - "Happy path: Render page with mixed section types"
    - "Happy path: Render with designSystem='untitledui'"
    - "Error paths: Unknown blockType logs warning, doesn't crash"
    - "Edge cases: Empty sections array renders empty page"
    - "Edge cases: Missing designSystem defaults to untitledui"
  mocking_policy:
    allowed: ["Section components for unit tests"]
    forbidden: []
  validation_commands:
    - "bunx vitest run --silent='passed-only' 'PageRenderer'"
risks:
  - "Risk: Type mismatch between Payload schema and PageRenderer props. Mitigation: Generate types from Payload config."
out_of_scope:
  - "Shadcn implementation (placeholder only)"
  - "Server-side rendering optimization"
estimated_minutes: 35
dependencies: ["TASK-016"]
phase: component-system
status: pending
created_date: "2025-11-29"
