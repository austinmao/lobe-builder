id: TASK-017
title: "Add SEO metadata (title, description, OG tags)"
objective: |
  Ensure the landing page has proper SEO metadata including title, description,
  and Open Graph tags for social sharing.
scope:
  - Verify title tag matches page title
  - Add meta description
  - Add Open Graph (og:) tags
  - Add Twitter Card tags
constraints:
  - Metadata may come from Payload CMS or page component
  - Follow SEO best practices
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: <title> tag contains page title"
  - "BLOCKING: <meta name='description'> is present"
  - "BLOCKING: og:title, og:description, og:image present"
  - "twitter:card tag present"
deliverables:
  - SEO metadata implemented
  - Verification of all tags
  - Social preview test (if possible)
risks:
  - PageRenderer may not include metadata
  - OG image may need to be created
out_of_scope:
  - Creating custom OG images
  - Advanced schema.org markup
  - Google Search Console setup
estimated_minutes: 30
dependencies: ["TASK-016"]
phase: "phase3-landing-page"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - SEO metadata validation"
  required_tests:
    - "Title tag present and correct"
    - "Description meta tag present"
    - "OG tags present"
    - "Twitter card tags present"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase3-landing-page.spec.ts --grep 'SEO metadata'"
