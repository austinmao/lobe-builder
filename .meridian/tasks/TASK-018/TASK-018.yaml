id: TASK-018
title: "Verify page load performance (< 3 seconds)"
objective: |
  Verify that the landing page loads in under 3 seconds to meet the success
  criteria defined in the PRD.
scope:
  - Measure Time to First Contentful Paint (FCP)
  - Measure Largest Contentful Paint (LCP)
  - Identify any blocking resources
  - Document performance metrics
constraints:
  - Test on representative connection (4G simulation)
  - Use Lighthouse or similar tool
  - Time: 20 minutes max
acceptance_criteria:
  - "BLOCKING: Page load time < 3 seconds"
  - "BLOCKING: LCP < 2.5 seconds"
  - "No render-blocking resources"
  - "No excessive JavaScript bundle"
deliverables:
  - Performance report with metrics
  - Lighthouse scores
  - Optimization recommendations if needed
risks:
  - Performance may vary by environment
  - Network conditions affect results
out_of_scope:
  - Performance optimization implementation
  - CDN configuration
  - Image optimization
estimated_minutes: 20
dependencies: ["TASK-017"]
phase: "phase3-landing-page"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "Performance validation"
  required_tests:
    - "Page load < 3 seconds"
    - "LCP < 2.5 seconds"
    - "FCP < 1.8 seconds"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase3-landing-page.spec.ts --grep 'load in < 3 seconds'"
