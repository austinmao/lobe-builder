id: TASK-010
title: "Create Pages collection with Payload blocks schema"
objective: |
  Define the Pages collection in Payload CMS with fields for tenantId, userId, slug,
  title, designSystem, and sections (as blocks). Create block definitions for hero,
  text, cta, and features section types.
scope:
  - "Create src/collections/Pages.ts with all required fields"
  - "Create src/blocks/HeroBlock.ts with title, subtitle, ctaLabel, ctaHref, backgroundImage fields"
  - "Create src/blocks/TextBlock.ts with heading, body fields"
  - "Create src/blocks/CTABlock.ts with heading, description, primaryButton, secondaryButton fields"
  - "Create src/blocks/FeaturesBlock.ts with heading, items array fields"
  - "Add designSystem field as select with 'untitledui' and 'shadcn' options"
constraints:
  - "Must include tenantId and userId fields with index: true"
  - "Slug must validate as lowercase alphanumeric with hyphens only"
  - "designSystem defaults to 'untitledui' if not specified"
  - "Time limit: 40-50 minutes"
acceptance_criteria:
  - "BLOCKING: Pages collection appears in Payload admin panel"
  - "BLOCKING: Creating a page with hero block succeeds via Payload admin"
  - "BLOCKING: tenantId and userId fields are indexed in database (verified via Drizzle studio or SQL)"
  - "All four block types (hero, text, cta, features) are available in block editor"
  - "designSystem field shows dropdown with 'untitledui' and 'shadcn' options"
deliverables:
  - "apps/payload/src/collections/Pages.ts"
  - "apps/payload/src/blocks/HeroBlock.ts"
  - "apps/payload/src/blocks/TextBlock.ts"
  - "apps/payload/src/blocks/CTABlock.ts"
  - "apps/payload/src/blocks/FeaturesBlock.ts"
  - "apps/payload/src/blocks/index.ts"
testing_requirements:
  coverage: "70%"
  required_tests:
    - "Happy path: Create page with hero section via Payload API"
    - "Error paths: Reject invalid slug formats (uppercase, special chars)"
    - "Error paths: Reject page without required tenantId field"
    - "Edge cases: Create page with all four block types"
  mocking_policy:
    allowed: ["Database connections"]
    forbidden: ["Internal business logic"]
  validation_commands:
    - "cd apps/payload && bunx vitest run --silent='passed-only' 'collections'"
risks:
  - "Risk: Block schema changes require migration. Mitigation: Design blocks to be extensible from the start."
out_of_scope:
  - "Access control (covered in TASK-011)"
  - "Testimonials and Pricing blocks (future phase)"
estimated_minutes: 45
dependencies: ["TASK-009"]
phase: foundation
status: pending
created_date: "2025-11-29"
