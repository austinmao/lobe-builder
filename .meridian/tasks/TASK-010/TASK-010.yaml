id: TASK-010
title: "Block /lp/* on main domain"
objective: |
  Block the /lp/* path prefix on the main domain (lobe-builder.vercel.app).
  This ensures that /lp/* URLs are only accessible via custom tenant domains,
  not the main application domain.
scope:
  - Detect main domain (not in TENANT_DOMAINS)
  - Block /lp/* paths on main domain with 404
  - Ensure other main domain routes unaffected
  - Log blocked requests
constraints:
  - Must not affect any existing LobeChat routes
  - Minimal overhead for non-/lp/* paths
  - Time: 20 minutes max
acceptance_criteria:
  - "BLOCKING: /lp/anything on main domain returns 404"
  - "BLOCKING: /page/ceremonia/slug on main domain works"
  - "BLOCKING: /preview/ceremonia/slug on main domain works"
  - "All existing LobeChat routes unaffected"
deliverables:
  - Main domain path blocking logic
  - Verification that existing routes work
risks:
  - May accidentally block wanted paths
  - Host detection may fail in some environments
out_of_scope:
  - Blocking other paths on main domain
  - Redirect logic
estimated_minutes: 20
dependencies: ["TASK-009"]
phase: "phase2-middleware"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - main domain blocking"
  required_tests:
    - "/lp/* blocked on main domain"
    - "/page/* allowed on main domain"
    - "/preview/* allowed on main domain"
    - "Other routes unaffected"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase2-middleware.spec.ts --grep 'block /lp/* paths on main'"
code_quality:
  max_complexity: 10
  max_function_length: 50
  max_nesting: 3
  no_magic_numbers: true
