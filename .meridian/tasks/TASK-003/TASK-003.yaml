id: TASK-003
title: "Create test page for Ceremonia via Payload API"
objective: |
  Create a test page using the Payload CMS API to verify the page creation workflow.
  This test page will be used to validate the preview and published routes before
  creating the actual landing page.
scope:
  - Login as Ceremonia user via API
  - Create test page with tenantId: ceremonia
  - Include basic sections (Hero, Features)
  - Save as draft (not published)
  - Verify page appears in Payload admin
constraints:
  - Use Payload REST API or GraphQL API
  - Page must be saved as draft initially
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: Page created via POST /api/payload/pages"
  - "BLOCKING: Page has tenantId: ceremonia"
  - "BLOCKING: Page has slug: test-page"
  - "BLOCKING: Page has _status: draft"
  - "Page visible in Payload admin for Ceremonia user"
deliverables:
  - Test page created in Payload CMS
  - API request/response documented
  - Page ID recorded for subsequent tasks
risks:
  - API endpoint path may differ from documentation
  - Validation errors if schema doesn't match
out_of_scope:
  - Creating the actual "Softening the Season" page
  - Publishing the test page (separate task)
  - Complex section configurations
estimated_minutes: 30
dependencies: ["TASK-002"]
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - API and response validation"
  required_tests:
    - "Happy path: Page creation succeeds with valid data"
    - "Error path: Missing tenantId rejected"
    - "Error path: Duplicate slug rejected"
    - "Edge case: Empty sections array allowed"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'create test page'"
