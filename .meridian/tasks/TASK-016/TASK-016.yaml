id: TASK-016
title: "Verify mobile responsive layout"
objective: |
  Verify that the landing page is fully responsive and works correctly on
  mobile devices (320px to 768px viewport widths).
scope:
  - Test at 320px, 375px, 414px, 768px viewports
  - Verify no horizontal scrolling
  - Check all sections stack correctly
  - Verify touch targets are adequate
constraints:
  - Use browser DevTools or Playwright for testing
  - Do not modify CSS (report issues only)
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: No horizontal scroll at 320px width"
  - "BLOCKING: All content readable on mobile"
  - "BLOCKING: CTA buttons have adequate touch target size"
  - "Typography scales appropriately"
deliverables:
  - Mobile responsiveness report
  - Screenshots at each viewport size
  - List of any issues found
risks:
  - Some components may not be fully responsive
  - Touch targets may be too small
out_of_scope:
  - Fixing responsiveness issues
  - Native app testing
estimated_minutes: 30
dependencies: ["TASK-015"]
phase: "phase3-landing-page"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - viewport testing"
  required_tests:
    - "320px viewport: no horizontal scroll"
    - "375px viewport: content readable"
    - "768px viewport: layout correct"
    - "Touch targets >= 44px"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase3-landing-page.spec.ts --grep 'mobile responsive'"
