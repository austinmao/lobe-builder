id: TASK-012
title: "Create Payload Users collection with tenant and role fields"
objective: |
  Create the Users collection in Payload CMS with authentication enabled,
  tenantId field for multi-tenant association, and role field for admin/user
  differentiation. This enables tenant-aware login to Payload admin.
scope:
  - "Create src/collections/Users.ts with auth: true"
  - "Add tenantId field with index for tenant association"
  - "Add role field as select with 'user' and 'admin' options (default: 'user')"
  - "Add email field as unique identifier (useAsTitle)"
  - "Create initial admin user seed script"
constraints:
  - "Must integrate with existing Clerk/NextAuth authentication (pass-through or sync)"
  - "Role field must default to 'user' for new registrations"
  - "Super admin user must be created during initial setup"
  - "Time limit: 30-40 minutes"
acceptance_criteria:
  - "BLOCKING: Users collection appears in Payload admin"
  - "BLOCKING: User can log in to Payload admin with email/password"
  - "BLOCKING: Logged-in user's tenantId is used for tenant filtering"
  - "Admin role user can see tenant selector and switch between tenants"
  - "Non-admin user sees only their tenant in admin panel"
deliverables:
  - "apps/payload/src/collections/Users.ts"
  - "apps/payload/scripts/seed-admin.ts"
  - "Updated apps/payload/payload.config.ts to include Users collection"
testing_requirements:
  coverage: "70%"
  required_tests:
    - "Happy path: Create user via API with tenantId"
    - "Happy path: User login returns correct role and tenantId"
    - "Error paths: Duplicate email registration fails"
    - "Edge cases: User without role defaults to 'user'"
  mocking_policy:
    allowed: ["Password hashing", "Email sending"]
    forbidden: ["Role assignment logic"]
  validation_commands:
    - "cd apps/payload && bunx vitest run --silent='passed-only' 'users'"
risks:
  - "Risk: Auth conflicts with existing Clerk auth. Mitigation: Keep Payload auth separate for CMS access only."
out_of_scope:
  - "SSO/OAuth integration"
  - "User sync between Clerk and Payload"
estimated_minutes: 35
dependencies: ["TASK-011"]
phase: foundation
status: pending
created_date: "2025-11-29"
