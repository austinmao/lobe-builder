id: TASK-002
title: "Create Ceremonia tenant user in Payload CMS"
objective: |
  Create the first tenant user for Ceremonia in Payload CMS. This user will be
  used to authenticate and create pages for the Ceremonia landing page system.
  The user must have tenantId: "ceremonia" to ensure proper multi-tenant isolation.
scope:
  - Create Payload user with email: admin@ceremoniacircle.org
  - Set tenantId to "ceremonia"
  - Set appropriate role (user or admin based on requirements)
  - Verify user can login to Payload admin
  - Verify user only sees ceremonia tenant data
constraints:
  - Use secure password (store in environment variables or secrets manager)
  - Do NOT hardcode production credentials in code
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: User exists with email admin@ceremoniacircle.org"
  - "BLOCKING: User has tenantId: ceremonia"
  - "BLOCKING: User can successfully login to Payload admin"
  - "User only sees pages with tenantId: ceremonia (tenant isolation)"
deliverables:
  - Ceremonia user created in Payload
  - Login verification screenshot or log
  - Credentials stored securely (document location)
risks:
  - Password security - must use secure storage
  - Tenant isolation may not be enforced if plugin misconfigured
out_of_scope:
  - Creating multiple users
  - OAuth/SSO integration
  - Production credentials (use test credentials for now)
estimated_minutes: 30
dependencies: ["TASK-001"]
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - user creation and verification"
  required_tests:
    - "Happy path: User creation succeeds"
    - "Error path: Duplicate user rejected"
    - "Security: User cannot access other tenant data"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'create Ceremonia tenant'"
