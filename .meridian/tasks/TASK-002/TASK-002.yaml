id: TASK-002
title: "Add data-testid to detail content wrapper components"
objective: |
  Add `data-testid="detail-content"` attribute to the main content wrapper in discover detail pages.
  The E2E tests at e2e/src/steps/discover/interactions.steps.ts expect this selector at lines 343, 378, 400, 438
  but the actual components don't have it.
  
  This fix addresses 3 failing tests:
  - DISCOVER-DETAIL-003: Load model detail content
  - DISCOVER-INTERACT-006: Navigate to model detail page
  - DISCOVER-INTERACT-007: Navigate to provider detail page
scope:
  - "Add data-testid='detail-content' to assistant detail wrapper"
  - "Add data-testid='detail-content' to model detail wrapper"
  - "Add data-testid='detail-content' to provider detail wrapper"
  - "Add data-testid='detail-content' to MCP detail wrapper"
constraints:
