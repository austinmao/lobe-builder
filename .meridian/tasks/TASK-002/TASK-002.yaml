  - "BLOCKING: DISCOVER-INTERACT-006 test passes when run with E2E test suite"
  - "BLOCKING: DISCOVER-INTERACT-007 test passes when run with E2E test suite"
  - "All previously passing detail page tests continue to pass"
deliverables:
  - "src/app/[variants]/(main)/discover/(detail)/assistant/features/Details/index.tsx - add data-testid"
  - "src/app/[variants]/(main)/discover/(detail)/model/features/Details/index.tsx - add data-testid"
  - "src/app/[variants]/(main)/discover/(detail)/provider/features/Details/index.tsx - add data-testid"
  - "src/app/[variants]/(main)/discover/(detail)/mcp/features/Details/index.tsx - add data-testid"
risks:
