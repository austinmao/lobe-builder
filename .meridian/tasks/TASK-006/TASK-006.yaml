id: TASK-006
title: "Implement BuilderRenderer component"
objective: |
  Implement the BuilderRenderer React component that renders Builder.io pages
  in an iframe. This is the GREEN phase - making the tests from TASK-002 pass.
scope:
  - "Create src/features/Portal/Artifacts/Body/Renderer/Builder.tsx"
  - "Parse JSON content to extract builderUrl"
  - "Render iframe with correct src and styles"
  - "Display error message for invalid content"
  - "Run TASK-002 tests and verify they PASS"
constraints:
  - "Must pass all tests in Builder.test.tsx"
