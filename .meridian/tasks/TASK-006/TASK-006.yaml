  - "BLOCKING: Component parses JSON content and extracts builderUrl"
  - "BLOCKING: Component renders iframe with src={builderUrl}"
  - "BLOCKING: Component renders iframe with styles: border none, 100% width, 100% height"
  - "BLOCKING: Component displays 'Invalid Builder artifact' when JSON is invalid"
  - "BLOCKING: Component displays error when builderUrl is missing or empty"
  - "BLOCKING: All tests in Builder.test.tsx PASS"
deliverables:
  - "src/features/Portal/Artifacts/Body/Renderer/Builder.tsx"
risks:
