id: TASK-006
title: "Verify cross-tenant isolation (security)"
objective: |
  Verify that the multi-tenant isolation is working correctly. A user from one
  tenant should NOT be able to access pages from another tenant. This is a
  critical security validation.
scope:
  - Attempt to access /preview/other-tenant/test-page (should fail)
  - Attempt to access /page/other-tenant/test-page (should fail)
  - Verify Ceremonia user cannot see other tenant's pages in API
  - Document security model
constraints:
  - Do NOT create actual security vulnerabilities
  - Test with non-existent tenant IDs
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: /preview/other-tenant/test-page returns 404 or 403"
  - "BLOCKING: /page/other-tenant/test-page returns 404 or 403"
  - "BLOCKING: API query with wrong tenantId returns no results"
  - "Payload admin filters pages by user's tenantId"
deliverables:
  - Security verification report
  - List of isolation boundaries tested
  - Recommendations for additional security testing
risks:
  - Tenant isolation may have gaps
  - API may not properly filter by tenantId
out_of_scope:
  - Penetration testing
  - Authentication bypass testing
  - Production security hardening
estimated_minutes: 30
dependencies: ["TASK-005"]
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - security boundary validation"
  required_tests:
    - "Cross-tenant preview route blocked"
    - "Cross-tenant published route blocked"
    - "API cross-tenant query returns empty"
    - "Direct URL guessing blocked"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'cross-tenant'"
