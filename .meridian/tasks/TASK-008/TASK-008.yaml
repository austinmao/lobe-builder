id: TASK-008
title: "Implement URL rewriting for custom domain paths"
objective: |
  Implement the URL rewriting logic in middleware that transforms custom domain
  paths to internal routes. /lp/{slug} on custom domain should rewrite to
  /page/{tenantId}/{slug}.
scope:
  - Implement /lp/{slug} → /page/ceremonia/{slug} rewrite
  - Handle root path (/ → redirect to /lp/home or 404)
  - Use NextResponse.rewrite() for internal rewrites
  - Add logging for debugging
constraints:
  - Rewrite is internal (URL in browser unchanged)
  - Must work with existing /page/[tenantId]/[slug] route
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: /lp/test-page on custom domain rewrites to /page/ceremonia/test-page"
  - "BLOCKING: Internal route renders correct content"
  - "Root path (/) redirects or returns appropriate response"
  - "Debug logging works in development mode"
deliverables:
  - URL rewriting logic in middleware
  - Root path handling
  - Logging statements for debugging
risks:
  - Rewrite may cause infinite loops if misconfigured
  - Slug extraction may fail with special characters
out_of_scope:
  - Path blocking (TASK-009)
  - Main domain blocking (TASK-010)
  - Custom headers (TASK-011)
estimated_minutes: 30
dependencies: ["TASK-007"]
phase: "phase2-middleware"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "90% - URL rewriting scenarios"
  required_tests:
    - "Happy path: /lp/slug rewrites correctly"
    - "Root path: / handles appropriately"
    - "Edge case: Slug with special characters"
    - "Edge case: Very long slug"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase2-middleware.spec.ts --grep 'root path'"
code_quality:
  max_complexity: 10
  max_function_length: 50
  max_nesting: 3
  no_magic_numbers: true
