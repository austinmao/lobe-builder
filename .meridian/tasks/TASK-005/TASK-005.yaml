id: TASK-005
title: "Verify published route filters by _status"
objective: |
  Verify that the published route (/page/[tenantId]/[slug]) correctly filters
  by _status field and only shows published pages. Draft pages should return 404
  on the published route. Then publish the test page and verify it renders.
scope:
  - Test /page/ceremonia/test-page returns 404 (page is draft)
  - Publish test page via Payload API
  - Verify /page/ceremonia/test-page returns 200 after publishing
  - Verify content matches preview route
constraints:
  - Do NOT modify existing route code
  - Use Payload API to publish (PATCH _status: published)
  - Time: 30 minutes max
acceptance_criteria:
  - "BLOCKING: Draft page returns 404 on /page/ceremonia/test-page"
  - "BLOCKING: Published page returns 200 on /page/ceremonia/test-page"
  - "BLOCKING: Published page content matches preview"
  - "Page remains visible on preview route after publishing"
deliverables:
  - Verification of draft → 404 behavior
  - Verification of published → 200 behavior
  - Screenshot of published page
risks:
  - Route may not correctly filter by _status
  - Payload publish workflow may differ from expected
out_of_scope:
  - Unpublishing workflow
  - Versioning/rollback functionality
estimated_minutes: 30
dependencies: ["TASK-003"]
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - status filtering validation"
  required_tests:
    - "Draft page returns 404 on published route"
    - "Publishing via API changes _status"
    - "Published page returns 200 on published route"
    - "Content identical between preview and published"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'draft page on published route'"
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'published page after publishing'"
