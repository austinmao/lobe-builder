id: TASK-013
title: "Create first landing page in Payload CMS"
objective: |
  Create the actual first landing page "Softening the Season: 3 Simple Skills
  for Connection in the Chaos" in Payload CMS with the correct slug and
  initial structure.
scope:
  - Create page with slug: softening-the-season-3-simple-skills-for-connection-in-the-chaos
  - Set tenantId: ceremonia
  - Set designSystem: untitledui
  - Save as draft initially
  - Verify accessible at preview route
constraints:
  - Use exact slug from PRD
  - Content can be placeholder initially
  - Time: 45 minutes max
acceptance_criteria:
  - "BLOCKING: Page exists with exact slug from PRD"
  - "BLOCKING: Page accessible at custom domain /lp/{slug}"
  - "BLOCKING: Page has designSystem: untitledui"
  - "Page saved as draft for content iteration"
deliverables:
  - Landing page created in Payload CMS
  - Page ID documented
  - Preview URL verified working
risks:
  - Slug length may cause issues
  - Middleware may not handle long slugs
out_of_scope:
  - Final content population (TASK-014)
  - Publishing (Phase 5)
estimated_minutes: 45
dependencies: ["TASK-012"]
phase: "phase3-landing-page"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - page creation and access"
  required_tests:
    - "Page created with correct slug"
    - "Page accessible via custom domain"
    - "Page uses correct design system"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase3-landing-page.spec.ts --grep 'access first page'"
