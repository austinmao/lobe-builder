id: TASK-015
title: "Create TextSection and CTASection components"
objective: |
  Build TextSection and CTASection components for the page builder using
  Untitled UI design patterns. TextSection displays heading and rich text
  body. CTASection displays a call-to-action block with primary and optional
  secondary buttons.
scope:
  - "Create src/components/PageRenderer/sections/TextSection.tsx"
  - "Create src/components/PageRenderer/sections/CTASection.tsx"
  - "TextSection supports heading and body (markdown or plain text)"
  - "CTASection supports heading, description, primaryButton, secondaryButton"
  - "Export both from sections/index.ts"
constraints:
  - "Must use Untitled UI Button component for CTA buttons"
  - "TextSection body should support basic markdown rendering"
  - "Must be responsive components"
  - "Time limit: 35-45 minutes"
acceptance_criteria:
  - "BLOCKING: TextSection renders heading and body text"
  - "BLOCKING: CTASection renders with primary button"
  - "BLOCKING: Secondary button renders only when secondaryButton prop provided"
  - "Typography uses theme CSS variables"
  - "Components are responsive on mobile"
deliverables:
  - "src/components/PageRenderer/sections/TextSection.tsx"
  - "src/components/PageRenderer/sections/CTASection.tsx"
  - "Updated src/components/PageRenderer/sections/index.ts"
testing_requirements:
  coverage: "70%"
  required_tests:
    - "Happy path: TextSection with heading and body"
    - "Happy path: CTASection with primary and secondary buttons"
    - "Edge cases: CTASection without secondary button"
    - "Edge cases: TextSection with markdown content"
  mocking_policy:
    allowed: []
    forbidden: []
  validation_commands:
    - "bunx vitest run --silent='passed-only' 'TextSection|CTASection'"
risks:
  - "Risk: Markdown rendering security (XSS). Mitigation: Use sanitized markdown renderer."
out_of_scope:
  - "Rich text editor integration"
  - "Custom markdown extensions"
estimated_minutes: 40
dependencies: ["TASK-014"]
phase: component-system
status: pending
created_date: "2025-11-29"
