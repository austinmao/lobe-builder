id: TASK-011
title: "Add x-tenant-id header for debugging"
objective: |
  Add a custom header (x-tenant-id) to responses from custom domains for
  debugging and monitoring purposes. This helps identify which tenant
  processed a request.
scope:
  - Add x-tenant-id header to all custom domain responses
  - Header value should be the resolved tenantId
  - Header should only be added in development/staging (configurable)
constraints:
  - Header should not leak sensitive information
  - Consider removing in production or making configurable
  - Time: 15 minutes max
acceptance_criteria:
  - "BLOCKING: Responses from custom domain include x-tenant-id header"
  - "BLOCKING: Header value is 'ceremonia' for live.ceremoniacircle.org"
  - "Header is configurable (can be disabled in production)"
deliverables:
  - x-tenant-id header implementation
  - Configuration for enabling/disabling
risks:
  - Header may expose tenant information (low risk)
  - May conflict with CDN caching
out_of_scope:
  - Request tracing/correlation IDs
  - Detailed debugging headers
  - Analytics integration
estimated_minutes: 15
dependencies: ["TASK-010"]
phase: "phase2-middleware"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "100% - header validation"
  required_tests:
    - "Header present on custom domain"
    - "Header has correct tenant value"
    - "Header absent on main domain (optional)"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase2-middleware.spec.ts --grep 'x-tenant-id header'"
code_quality:
  max_complexity: 5
  max_function_length: 20
  max_nesting: 2
  no_magic_numbers: true
