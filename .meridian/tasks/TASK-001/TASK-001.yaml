id: TASK-001
title: "Verify Payload CMS collections exist for pages"
objective: |
  Verify that the existing Payload CMS installation has the required collections
  configured for the Ceremonia landing page system. This is the foundation task
  that ensures the infrastructure is ready for tenant creation.
scope:
  - Verify 'pages' collection exists in Payload CMS
  - Verify 'users' collection supports tenantId field
  - Verify multi-tenant plugin is installed and configured
  - Document any missing configurations
constraints:
  - Do NOT modify existing Payload configurations
  - Read-only verification task
  - Time: 15 minutes max
acceptance_criteria:
  - "BLOCKING: pages collection exists with slug, title, tenantId, sections fields"
  - "BLOCKING: users collection has tenantId field"
  - "BLOCKING: @payloadcms/plugin-multi-tenant is in package.json dependencies"
  - "Payload admin accessible at /admin endpoint"
deliverables:
  - Verification checklist (in TASK-001-context.md)
  - List of any missing configurations
risks:
  - Payload CMS may not be fully configured yet
  - Multi-tenant plugin may need additional setup
out_of_scope:
  - Creating new collections
  - Modifying Payload configuration
  - Creating users or pages
estimated_minutes: 15
dependencies: []
phase: "phase1-infrastructure"
status: pending
created_date: "2025-12-10"
testing_requirements:
  coverage: "N/A - verification task"
  required_tests:
    - "Verify pages collection schema"
    - "Verify users collection schema"
    - "Verify plugin configuration"
  validation_commands:
    - "cd lobe-builder && npx playwright test tests/e2e/ceremonia/phase1-infrastructure.spec.ts --grep 'tenant infrastructure'"
